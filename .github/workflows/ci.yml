name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  import-smoke:
    name: Import twice against the Vendor C mock
    runs-on: ubuntu-latest
    needs: test
    env:
      VENDOR_C_API_KEY: ${{ secrets.VENDOR_C_API_KEY }}   # the mock's test key, stored as a repository secret
      DATABASE_PATH: ./ci.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Vendor C mock
        run: |
          node vendor-c-mock/server.js > mock.log 2>&1 &
          for i in $(seq 1 20); do curl -sf localhost:4010/health && break; sleep 0.5; done
      - name: First import
        run: npm run import -- --no-alerts | tee run1.log
      - name: Second import must be a no-op
        run: |
          npm run import -- --no-alerts | tee run2.log
          if grep -E "inserted [1-9]|updated [1-9]|removed [1-9]" run2.log; then
            echo "Second import changed data; import is not idempotent" >&2
            exit 1
          fi
      - name: Alerts dry run
        run: npm run alerts -- --dry-run
      - name: Mock log
        if: always()
        run: tail -n 20 mock.log
